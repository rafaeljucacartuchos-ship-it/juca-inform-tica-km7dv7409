<!doctype html>
<html lang="en" data-app-version="__APP_VERSION__">
  <head>
    <script>
      // SW killer: remove Service Workers antigos registrados sem updateViaCache:'none'.
      // Roda UMA vez por dispositivo (localStorage) e recarrega a página para o novo
      // SW ser registrado do zero com updateViaCache:'none' (via src/lib/register-sw.ts).
      (function () {
        try {
          if (localStorage.getItem('sw_cleanup_v1')) return;
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (!regs.length) {
                localStorage.setItem('sw_cleanup_v1', '1');
                return;
              }
              Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
                localStorage.setItem('sw_cleanup_v1', '1');
                window.location.reload();
              });
            }).catch(function () {
              localStorage.setItem('sw_cleanup_v1', '1');
            });
          } else {
            localStorage.setItem('sw_cleanup_v1', '1');
          }
        } catch (e) {}
      })();
    </script>
    <!--
      SW killer externo: carregado ANTES dos demais scripts (logo após o killer
      inline). Por ser um asset .js, o SW ativo o busca pela rede primeiro
      (NetworkFirst), então a versão nova chega ao dispositivo mesmo quando o
      index.html está cacheado. A chave sw_cleanup_v2 força reexecução em
      dispositivos que rodaram o v1 sem sucesso. Veja public/skip.js.
    -->
    <script src="/skip.js"></script>

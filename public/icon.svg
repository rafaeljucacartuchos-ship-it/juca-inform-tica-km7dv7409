<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="iBlue1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="iBlue2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="iBlue3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="iDivider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#60a5fa"/>
      <stop offset="75%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="100" fill="url(#iconBg)"/>
  
  <g transform="translate(16, 85) scale(1.6)">
    <!-- Pixel/Block pattern -->
    <g id="pixel-cluster-lg">
      <rect x="36" y="24" width="10" height="10" rx="1.5" fill="url(#iBlue2)" />
      <rect x="48" y="22" width="12" height="12" rx="1.5" fill="url(#iBlue3)" />
      <rect x="32" y="36" width="14" height="14" rx="2" fill="url(#iBlue1)" />
      <rect x="48" y="36" width="11" height="11" rx="1.5" fill="url(#iBlue2)" />
      <rect x="61" y="33" width="9" height="9" rx="1" fill="url(#iBlue3)" />
      <rect x="25" y="48" width="12" height="12" rx="1.5" fill="url(#iBlue3)" />
      <rect x="39" y="52" width="15" height="15" rx="2" fill="url(#iBlue1)" />
      <rect x="56" y="49" width="10" height="10" rx="1.5" fill="url(#iBlue2)" />
      <rect x="23" y="62" width="14" height="14" rx="2" fill="url(#iBlue2)" />
      <rect x="39" y="69" width="11" height="11" rx="1.5" fill="url(#iBlue3)" />
      <rect x="52" y="61" width="13" height="13" rx="1.5" fill="url(#iBlue1)" />
      <rect x="67" y="64" width="8" height="8" rx="1" fill="url(#iBlue2)" />
      <rect x="28" y="78" width="10" height="10" rx="1.5" fill="url(#iBlue1)" />
      <rect x="40" y="82" width="8" height="8" rx="1" fill="url(#iBlue2)" />
      <rect x="50" y="76" width="11" height="11" rx="1.5" fill="url(#iBlue3)" />
    </g>

    <!-- JUCA Typography -->
    <text x="82" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="1">JUCA</text>
    
    <!-- INFORMÁTICA Subtitle -->
    <text x="83" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14.5" fill="#ffffff" letter-spacing="4.5">INFORMÁTICA</text>
    
    <!-- Divider line -->
    <line x1="24" y1="99" x2="276" y2="99" stroke="url(#iDivider)" stroke-width="1.5"/>
    
    <!-- SOLUÇÃO E TECNOLOGIA Slogan -->
    <text x="150" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#ffffff" letter-spacing="4" text-anchor="middle">SOLUÇÃO E TECNOLOGIA</text>
  </g>
</svg>
